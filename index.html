<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete Touchpoint Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{--g:#13BE17;--bg:#000;--p1:#0d0d0d;--p2:#161616;--ln:#2a2a2a;--tx:#fff;--mu:#8d8d8d;--amb:#f5b301}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Public Sans',system-ui,sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:8px 12px 30px}
h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.3px;text-transform:uppercase}
h1 span{color:var(--g)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sub{color:var(--mu);font-style:italic;font-weight:500;margin:2px 0 16px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.card>h2,.ttl{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--g);font-weight:800}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px;font-weight:600}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit}
textarea{resize:none;min-height:0;height:32px;overflow:hidden;display:block}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g)}
.row{display:grid;gap:12px}.r2{grid-template-columns:1fr 1fr}
@media(max-width:640px){.r2{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--p2);color:var(--mu);border:0;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--g);color:#000}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--g)}
.btn{background:var(--g);color:#000;border:0;border-radius:8px;padding:8px 18px;font:inherit;font-weight:800;cursor:pointer;width:100%;margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
.ghost{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:8px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer;text-transform:uppercase;font-weight:600}
.ghost:hover{color:#fff;border-color:var(--g)}
.datebtn{position:relative;display:flex;align-items:center;justify-content:space-between;background:var(--p2);border:1.5px solid var(--g);border-radius:10px;padding:0 12px;height:36px;font-weight:800;font-size:15px;cursor:pointer}
.datebtn .ico{font-size:20px}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;font-size:16px}
.hint{font-size:12px;color:var(--mu);margin-top:4px}.hint b{color:var(--g)}

/* ---------- calendar (matches 52-week program look) ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .ttl{margin:0}
.bar select{width:auto;min-width:150px;padding:7px 10px;font-size:13px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mu);text-transform:uppercase;font-weight:800;letter-spacing:.8px;margin:0 0 10px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.scroll{overflow-x:auto;border:1px solid var(--ln);border-radius:10px;background:#0a0a0a}
.grid{min-width:960px}
.rw{display:grid;grid-template-columns:56px repeat(37,minmax(24px,1fr))}
.rw+.rw{border-top:1px solid #1d1d1d}
.hd div{font-size:11px;font-weight:800;color:var(--mu);text-align:center;padding:6px 0;letter-spacing:.5px}
.hd .yr{color:var(--g);font-size:13px;text-align:left;padding-left:8px}
.mlab{position:sticky;left:0;background:#0a0a0a;z-index:2;font-weight:800;font-size:13px;display:flex;align-items:center;padding-left:8px;text-transform:uppercase;border-right:1px solid #1d1d1d}
.c{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3px;position:relative;cursor:pointer;border-radius:4px;margin:1px}
.c.e,.c.out{cursor:default}
.c .dn{font-size:10px;color:var(--mu);line-height:1}
.c .l{font-size:16px;font-weight:800;color:var(--g);line-height:1.15}
.c.lift{background:rgba(19,190,23,.10)}
.c.out .dn{opacity:.35}
.c.wk::after{content:'';position:absolute;left:1px;right:1px;bottom:0;height:3px;background:var(--amb);border-radius:2px}
.c .dot{position:absolute;top:2px;right:2px;min-width:7px;height:7px;border-radius:50%;background:var(--amb)}
.c.today{outline:1.5px solid #fff}
.c.today .dn{color:#fff;font-weight:800}
.c.sel{background:var(--g)}
.c.sel .dn,.c.sel .l{color:#000}
.c.sel .dot{background:#000}

.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-bottom:8px}.top>.card,.top>.col{margin:0}
@media(max-width:760px){.top{grid-template-columns:1fr}}
#wkToggle{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}#wkToggle:focus-visible{outline:2px solid var(--g)}
/* ---------- 3 columns ---------- */
.cols{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
.col{background:var(--p1);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;min-width:0}
.col h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--g);font-weight:800}
.col .dsub{color:var(--mu);font-size:12px;margin:2px 0 12px}
.swipe{display:none;font-size:11px;color:var(--mu);text-align:right;margin:-4px 2px 6px;font-style:italic}
@media(max-width:760px){
  .cols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:6px}
  .col{flex:0 0 88%;scroll-snap-align:start}
  .swipe{display:block}
}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--g);border-radius:8px;padding:6px 8px;margin-bottom:5px}
.item.wkit{border-left-color:var(--amb)}
.item.done{opacity:.45;border-left-color:var(--ln)}
.item.done .nt{text-decoration:line-through}
.ck{width:20px;height:20px;border:2px solid var(--g);border-radius:5px;background:none;cursor:pointer;flex:none;margin-top:2px;color:#000;font-weight:800;line-height:1;padding:0;font-size:12px}
.item.wkit .ck{border-color:var(--amb)}
.item.done .ck{background:var(--g)}
.who{font-weight:800}
.fld{color:var(--mu);font-size:12px}
.nt{color:#ddd;margin-top:2px;word-break:break-word}
.x{margin-left:auto;background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px;flex:none;line-height:1}
.x:hover{color:#ff5a5a}
.empty{color:var(--mu);font-size:13px;font-style:italic;padding:4px 0}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mu);font-weight:800;margin:14px 0 6px}
.glance{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid transparent}
.glance:hover{border-color:var(--ln)}
.glance.sel{background:#0b1f0c;border-color:var(--g)}
.glance b{display:inline-block;width:42px}
.glance .ls{color:var(--g);font-weight:800;margin-right:6px}
.glance .nn{color:var(--amb);font-weight:700;text-align:right;display:flex;align-items:center;gap:8px}
.glance .chev{color:var(--mu);font-size:11px}
.gopen{margin:2px 0 8px 6px;padding-left:8px;border-left:2px solid var(--g)}
.ex{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln);font-size:14px}
.ex:last-child{border:0}
.ex .sr{margin-left:auto;font-weight:800;color:var(--g);white-space:nowrap}
.ex .an{font-size:10px;background:var(--g);color:#000;border-radius:4px;padding:1px 5px;font-weight:800;margin-left:6px;vertical-align:1px}
.exnote{font-size:11px;color:var(--mu);font-style:italic;margin-top:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--g);color:#000;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 25 25" width="34" height="34" aria-label="STS"><g transform="translate(-0.4,23.2) scale(0.01,-0.01)" fill="#13BE17" stroke="none"><path d="M1015 2355 c-376 -67 -689 -305 -870 -665 -129 -256 -140 -589 -29 -868 62 -154 178 -334 284 -440 172 -173 449 -301 688 -319 45 -3 82 -10 82 -14 0 -5 11 -9 25 -9 14 0 25 5 25 10 0 6 20 10 45 10 105 0 312 58 435 122 393 204 662 646 636 1049 -11 171 -48 315 -119 454 l-33 67 -660 1 c-645 0 -660 0 -706 -20 -60 -27 -125 -94 -156 -161 -19 -42 -24 -69 -24 -130 1 -66 5 -85 34 -141 36 -72 102 -130 168 -150 23 -7 133 -11 296 -11 143 0 275 -5 294 -10 20 -5 51 -26 70 -45 33 -34 35 -41 35 -101 0 -64 -1 -66 -42 -105 l-42 -39 -594 0 -594 0 -12 38 c-80 240 -80 476 -1 680 51 133 122 235 249 362 122 120 199 174 323 223 259 104 549 90 797 -38 103 -53 229 -151 301 -235 l52 -60 84 0 c46 0 84 4 84 9 0 20 -98 141 -175 217 -160 157 -381 276 -590 319 -60 12 -291 12 -360 0z m1105 -799 c28 -62 58 -197 65 -296 23 -306 -120 -618 -379 -826 -96 -77 -268 -165 -378 -193 -208 -53 -441 -32 -645 60 -148 66 -315 204 -401 331 l-33 48 568 2 c637 3 605 0 683 78 63 63 85 121 85 225 0 78 -4 97 -27 140 -14 28 -47 70 -73 94 -82 75 -84 75 -410 79 l-290 3 -32 25 c-92 70 -82 207 17 256 32 17 84 18 633 18 l598 0 19 -44z"/></g></svg><h1>Athlete <span>Touchpoint</span> Calendar</h1></div>

  <div class="top">
  <!-- WEEK NOTES -->
  <div class="col"><h3 id="wkToggle" role="button" tabindex="0" aria-expanded="true">Week Overview Notes <span id="wkChev">&#9660;</span></h3>
    <div id="wkBody"><div id="weekList"></div><div id="glance"></div></div></div>

  <!-- ENTRY -->
  <div class="card">
    <h2>Log a Touchpoint</h2>
    <div>
      <label for="ath">Athlete name</label>
      <input type="text" id="ath" placeholder="e.g. Jake Miller" list="athlist" autocomplete="off"><datalist id="athlist"></datalist>
    </div>
    <div style="margin-top:5px"><label for="note">Hospitality note — what did the athlete share?</label>
      <textarea id="note" rows="1" placeholder="e.g. Grandma is in the hospital. Ask how she's doing."></textarea></div>
    <div style="margin-top:5px"><label for="when">Bring it up on</label>
      <div class="datebtn"><span id="whenTxt"></span><span class="ico">&#128197;</span>
        <input type="date" id="when" aria-label="Bring it up on"></div></div>
    <button class="btn" id="add">Add to Calendar</button>
  </div>
  </div>

  <!-- CALENDAR -->
  <div class="card">
    <div class="bar">
      <div class="ttl">52-Week Calendar</div>
      <select id="filter"><option value="">All athletes</option></select>
      <button class="ghost" id="goToday">Today</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--amb);border-radius:50%;width:8px;height:8px"></i>Day note</span>
      <span><i style="background:var(--amb);height:3px;vertical-align:2px"></i>Week note</span>
    </div>
    <div class="scroll"><div class="grid" id="calBody"></div></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY='sts_touchpoints_v2';
  var MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var $=function(i){return document.getElementById(i);};

  var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  var start=monday(today), end=addDays(start,52*7-1);
  var todayK=key(today);
  var mode='day', selected=todayK, filter='', collapsed=false, lastSel=null;
  var data=load();

  /* Mon A, Tue B, Thu C, Fri D (matches the 52-week program) */
  var LET={0:'A',1:'B',3:'C',4:'D'};
  function letterFor(d){return '';}


  function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(!o.demo)return o;}}catch(e){}return seed();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  function seed(){return {demo:false,items:[]};}
  function nextId(){var m=0;data.items.forEach(function(i){if(i.id>m)m=i.id;});return m+1;}

  /* ---------- form ---------- */
  var whenEl=$('when');whenEl.min=key(start);whenEl.max=key(end);
  function hint(){var d=parse(selected);whenEl.value=selected;$('whenTxt').textContent=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
  whenEl.onclick=function(){try{if(whenEl.showPicker)whenEl.showPicker();}catch(e){}};
  whenEl.onchange=function(){var v=whenEl.value;if(!v)return;var d=parse(v);if(d<start||d>end){toast('Pick a date inside the 52 weeks');hint();return;}selected=v;renderAll();};

  $('add').onclick=function(){
    var a=$('ath').value.trim(),n=$('note').value.trim(),v=whenEl.value||selected;
    if(!a||!n){toast('Add athlete and note');return;}
    var d=parse(v);if(d<start||d>end){toast('Date must be inside the 52 weeks');return;}
    if(data.demo)data={demo:false,items:[]};
    data.items.push({id:nextId(),athlete:a,field:'',note:n,type:'day',date:v,done:false});
    save();selected=v;$('note').value='';grow();renderAll();toast('Added for '+a);
  };
  $('filter').onchange=function(){filter=this.value;renderAll();};
  $('goToday').onclick=function(){selected=todayK;renderAll();};

  function visible(){return data.items.filter(function(i){return !filter||i.athlete===filter;});}
  function renderNames(){
    var s={};data.items.forEach(function(i){s[i.athlete]=1;});var names=Object.keys(s).sort();
    $('athlist').innerHTML=names.map(function(n){return '<option value="'+esc(n)+'">';}).join('');
    var f=$('filter'),cur=filter;
    f.innerHTML='<option value="">All athletes</option>'+names.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');
    f.value=names.indexOf(cur)>-1?cur:'';filter=f.value;
  }

  /* ---------- calendar ---------- */
  function renderCal(){
    var v=visible(),byDay={},byWeek={};
    v.forEach(function(i){var m=i.type==='day'?byDay:byWeek;(m[i.date]=m[i.date]||[]).push(i);});
    var h='<div class="rw hd"><div class="yr">'+start.getFullYear()+'</div>';
    var hdr='MTWTFSS';for(var c=0;c<37;c++)h+='<div>'+hdr[c%7]+'</div>';h+='</div>';
    var y=start.getFullYear(),m=start.getMonth();
    for(var r=0;r<13;r++){
      var first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
      var lab=MS[m].toUpperCase()+(m===0?" '"+String(y).slice(2):'');
      h+='<div class="rw"><div class="mlab">'+lab+'</div>';
      for(c=0;c<37;c++){
        var dn=c-off+1;
        if(dn<1||dn>dim){h+='<div class="c e"></div>';continue;}
        var d=new Date(y,m,dn),k=key(d),inW=d>=start&&d<=end;
        var L=inW?letterFor(d):'';
        var cls='c'+(inW?'':' out')+(L?' lift':'')+(k===todayK?' today':'')+(k===selected?' sel':'');
        if(inW&&byWeek[key(monday(d))])cls+=' wk';
        var dayN=byDay[k]?byDay[k].length:0;
        h+='<div class="'+cls+'"'+(inW?' data-k="'+k+'"':'')+'><span class="dn">'+dn+'</span>'+(L?'<span class="l">'+L+'</span>':'')+(dayN?'<span class="dot"></span>':'')+'</div>';
      }
      h+='</div>';
      m++;if(m>11){m=0;y++;}
    }
    $('calBody').innerHTML=h;
  }
  $('calBody').addEventListener('click',function(e){
    var c=e.target.closest('[data-k]');if(!c)return;
    selected=c.getAttribute('data-k');
    
    renderAll();
  });

  /* ---------- columns ---------- */
  function itemHTML(i,wk){
    return '<div class="item'+(wk?' wkit':'')+(i.done?' done':'')+'" data-id="'+i.id+'">'+
      '<button class="ck" data-act="done" aria-label="Done">'+(i.done?'✓':'')+'</button>'+
      '<div><div><span class="who">'+esc(i.athlete)+'</span>'+'</div>'+
      '<div class="nt">'+esc(i.note)+'</div></div>'+
      '<button class="x" data-act="del" aria-label="Delete">×</button></div>';
  }
  function renderCols(){
    var sd=parse(selected),ws=monday(sd),wk=key(ws),we=addDays(ws,6),v=visible();
    var wnum=Math.floor((ws-start)/(7*864e5))+1;
    if(selected!==lastSel){collapsed=false;lastSel=selected;}

    var wi=v.filter(function(i){return i.type==='week'&&i.date===wk;});
    $('weekList').innerHTML=wi.length?wi.map(function(i){return itemHTML(i,true);}).join(''):'';
    var g='';
    for(var d=0;d<7;d++){
      var dt=addDays(ws,d),k=key(dt),L=letterFor(dt);
      var ns=v.filter(function(i){return i.type==='day'&&i.date===k;});
      var names=ns.map(function(i){return i.athlete.split(' ')[0];}).join(', ');
      var isOpen=(k===selected&&!collapsed);
      g+='<div class="glance'+(k===selected?' sel':'')+'" data-k="'+k+'"><span><b>'+DN[dt.getDay()]+' '+dt.getDate()+'</b><span class="ls">'+L+'</span></span><span class="nn">'+(names?esc(names):'')+'<span class="chev">'+(isOpen?'&#9660;':'&#9654;')+'</span></span></div>';
      if(isOpen)g+='<div class="gopen">'+(ns.length?ns.map(function(i){return itemHTML(i,false);}).join(''):'<div class="empty">No notes this day.</div>')+'</div>';
    }
    $('glance').innerHTML=g;

  }
  document.addEventListener('click',function(e){
    var g=e.target.closest('.glance');
    if(g){var gk=g.getAttribute('data-k');if(gk===selected){collapsed=!collapsed;}else{selected=gk;collapsed=false;}renderAll();return;}
    var b=e.target.closest('[data-act]');if(!b)return;
    var it=b.closest('.item');if(!it)return;var id=+it.getAttribute('data-id');
    if(b.getAttribute('data-act')==='del')data.items=data.items.filter(function(i){return i.id!==id;});
    else data.items.forEach(function(i){if(i.id===id)i.done=!i.done;});
    save();renderAll();
  });

  function grow(){var n=$('note');n.style.height='auto';n.style.height=Math.max(32,n.scrollHeight+2)+'px';}
  $('note').addEventListener('input',grow);
  var WK='sts_week_collapsed';
  function wkApply(c){$('wkBody').style.display=c?'none':'';$('wkChev').innerHTML=c?'&#9654;':'&#9660;';$('wkToggle').setAttribute('aria-expanded',c?'false':'true');}
  var wkC=false;try{wkC=localStorage.getItem(WK)==='1';}catch(e){}
  wkApply(wkC);
  function wkFlip(){wkC=!wkC;wkApply(wkC);try{localStorage.setItem(WK,wkC?'1':'0');}catch(e){}}
  $('wkToggle').onclick=wkFlip;
  $('wkToggle').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();wkFlip();}};
  function renderAll(){hint();renderNames();renderCal();renderCols();}
  var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show');},1800);}
  renderAll();
})();
</script>
</body>
</html>
